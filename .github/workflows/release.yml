name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Homebrew formula on main
        run: |
          v="${GITHUB_REF_NAME#v}"
          scripts/formula.sh "$v" dist/checksums.txt > /tmp/ccfleet.rb
          git fetch origin main
          git checkout main
          mkdir -p Formula && cp /tmp/ccfleet.rb Formula/ccfleet.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ccfleet.rb
          git diff --cached --quiet || git commit -m "Formula: ccfleet ${v}"
          git push origin main
